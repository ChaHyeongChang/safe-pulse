org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# 제출 APK 이름에 들어갈 팀명. 예: ./gradlew exportReleaseApk -Psafepulse.teamName=우리팀
safepulse.teamName=MONDAI
# Pleos Vehicle SDK 사용 여부. Pleos Nexus에 접속할 수 없는 환경이면 false로 두고 빌드한다.
safepulse.pleosSdk=true
